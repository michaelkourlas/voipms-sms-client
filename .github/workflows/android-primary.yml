name: Android CI (primary)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Create google-services.json
        env:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $google_services_json | base64 -d > voipms-sms/src/primary/google-services.json
      - name: Build with Gradle
        run: ./gradlew assemblePrimaryFullRelease
      - name: Lint with Gradle
        run: ./gradlew lintPrimaryFullRelease
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-primary
          path: voipms-sms/build/reports/lint-results-primaryFullRelease.html
